<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Bets · The Buckeye Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="leaf">🌰</span><h1>THE <span>BUCKEYE</span> BOOK</h1></div>
    <div class="balance-chip" id="balance-chip">—</div>
  </header>
  <nav class="tabs">
    <a href="index.html">Home</a>
    <a href="picks.html">Weekly Picks</a>
    <a href="live.html">Live Bets</a>
    <a href="sidebets.html">Active Sidebets</a>
    <a href="ledger.html">Standings</a>
    <a href="offline.html">Offline Entry</a>
    <a href="rules.html">Rules</a>
  </nav>

  <div class="shell">
    <div class="card">
      <h3>Propose a Bet</h3>
      <form id="propose-form" style="display:grid;gap:10px;">
        <div>
          <label class="label" style="font-size:11px;color:var(--gray-light);display:block;margin-bottom:4px;">Which game is this about? (optional, but needed for live odds suggestions)</label>
          <select id="propose-game" style="width:100%;"></select>
        </div>
        <input id="propose-desc" placeholder='e.g. "Next drive ends in a punt"' required />
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          <label class="label" style="font-size:12px;">
            <input type="radio" name="mode" value="even" checked /> 50/50
          </label>
          <label class="label" style="font-size:12px;">
            <input type="radio" name="mode" value="odds" /> Odds-based
          </label>
          <input id="odds-input" type="number" step="0.1" placeholder="Odds (e.g. 3 = 3:1)" style="width:150px;display:none;" />
          <button type="button" id="use-live-odds-btn" class="small ghost" style="display:none;">Use Live Odds</button>
        </div>
        <p id="live-odds-note" style="font-size:11px;color:var(--gray-light);display:none;margin:0;"></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <label class="label" style="font-size:12px;">
            <input type="radio" name="scope" value="open" checked /> Open to anyone
          </label>
          <label class="label" style="font-size:12px;">
            <input type="radio" name="scope" value="group" /> Challenge specific people
          </label>
        </div>
        <div id="invite-players" style="display:flex;gap:12px;flex-wrap:wrap;"></div>
        <input id="propose-wager" type="number" min="1" placeholder="Your wager $" required style="width:150px;" />
        <button type="submit" class="small">Propose</button>
      </form>
    </div>

    <div class="section-title">
      <h2>Live Feed</h2>
      <span class="sub">Updates instantly for everyone</span>
    </div>
    <div id="live-feed"></div>
  </div>

  <script type="module">
    import { initAuth, highlightNav, currentUser, initNetworkStatus } from "./js/app.js?v=20260828u";
    import { loadRoster, proposeBet, renderFeed, loadGamesForBetting, getGameForBetting, computeLiveOdds } from "./js/live.js?v=20260828u";

    highlightNav();
    initNetworkStatus();
    initAuth(() => { loadRoster(); loadGamesForBetting(); renderFeed("live-feed"); });

    document.querySelectorAll('input[name="mode"]').forEach(r =>
      r.addEventListener("change", () => {
        const isOdds = document.querySelector('input[name="mode"]:checked').value === "odds";
        document.getElementById("odds-input").style.display = isOdds ? "block" : "none";
        document.getElementById("use-live-odds-btn").style.display = isOdds ? "block" : "none";
      })
    );

    document.getElementById("use-live-odds-btn").addEventListener("click", () => {
      const gameId = document.getElementById("propose-game").value;
      const noteEl = document.getElementById("live-odds-note");
      if (!gameId) { toast("Pick a game above first."); return; }
      const game = getGameForBetting(gameId);
      if (!game) { toast("Couldn't find that game's data."); return; }
      const { homeWinProb, awayWinProb, favoredIsHome, fairUnderdogOdds } = computeLiveOdds(game);
      document.getElementById("odds-input").value = fairUnderdogOdds;
      const favored = favoredIsHome ? game.homeTeam : game.awayTeam;
      const underdog = favoredIsHome ? game.awayTeam : game.homeTeam;
      noteEl.style.display = "block";
      noteEl.textContent = `Estimate from current score/time only (${favored} ${Math.round(Math.max(homeWinProb, awayWinProb) * 100)}% · ${underdog} ${Math.round(Math.min(homeWinProb, awayWinProb) * 100)}%) — not a real market line. Filled in ${fairUnderdogOdds}:1 for backing ${underdog}; adjust as needed.`;
    });

    document.getElementById("propose-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const scope = document.querySelector('input[name="scope"]:checked').value;
      const description = document.getElementById("propose-desc").value;
      const gameId = document.getElementById("propose-game").value || null;
      const odds = mode === "odds" ? parseFloat(document.getElementById("odds-input").value) : null;
      const invited = scope === "group"
        ? [...document.querySelectorAll('#invite-players input:checked')].map(i => ({ uid: i.value, name: i.dataset.name }))
        : [];
      await proposeBet({ gameId, description, mode, scope, odds, invited });
      e.target.reset();
      document.getElementById("live-odds-note").style.display = "none";
    });
  </script>
</body>
</html>
