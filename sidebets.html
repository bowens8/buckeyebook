<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Active Sidebets · The Buckeye Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="leaf">🌰</span><h1>THE <span>BUCKEYE</span> BOOK</h1></div>
    <div class="balance-chip" id="balance-chip">—</div>
  </header>
  <nav class="tabs">
    <a href="index.html">Home</a>
    <a href="picks.html">Weekly Picks</a>
    <a href="live.html">Live Bets</a>
    <a href="sidebets.html">Active Sidebets</a>
    <a href="ledger.html">Standings</a>
    <a href="offline.html">Offline Entry</a>
    <a href="rules.html">Rules</a>
  </nav>

  <div class="shell">
    <div class="section-title"><h2>Waiting On You</h2><span class="sub">Group challenges that need a response</span></div>
    <div id="feed-pending"></div>

    <div class="section-title"><h2>Open Pools You Can Join</h2><span class="sub">No invite needed</span></div>
    <div id="feed-open-pools"></div>

    <div class="section-title"><h2>Your Active Bets</h2><span class="sub">Accepted, waiting on an outcome</span></div>
    <div id="feed-mine"></div>

    <div class="section-title"><h2>All Open Action</h2><span class="sub">Everything still live right now</span></div>
    <div id="feed-all-open"></div>
  </div>

  <script type="module">
    import { initAuth, highlightNav, initNetworkStatus, currentUser } from "./js/app.js?v=20260828u";
    import { renderFeed, loadGamesForBetting } from "./js/live.js?v=20260828u";

    highlightNav();
    initNetworkStatus();
    initAuth(() => {
      loadGamesForBetting(); // populates the game-name lookup used when a bet is linked to a specific game
      // Bets where I'm invited and haven't responded yet.
      renderFeed("feed-pending", (bet, responses) =>
        bet.status === "open" &&
        responses.some(r => r.playerId === currentUser.uid && r.response === "pending")
      );

      // Open pools I haven't joined and didn't propose.
      renderFeed("feed-open-pools", (bet, responses) =>
        bet.status === "open" && bet.scope === "open" &&
        bet.proposedBy !== currentUser.uid &&
        !responses.some(r => r.playerId === currentUser.uid)
      );

      // Bets I'm already in (proposed or accepted) that haven't settled.
      renderFeed("feed-mine", (bet, responses) =>
        bet.status === "open" &&
        (bet.proposedBy === currentUser.uid ||
          responses.some(r => r.playerId === currentUser.uid && r.response === "accepted"))
      );

      // Everything still open, full stop.
      renderFeed("feed-all-open", (bet) => bet.status === "open");
    });
  </script>
</body>
</html>
